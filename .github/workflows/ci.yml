# CI
#
# What CI guards, and why each step is here:
#
#   - `build`, then `typecheck` and `test`: the baseline net under the seven
#     TypeScript packages. The order matters and used to be wrong — see below.
#   - `forge test`: the contract and its stateful fuzzing invariants. It is the
#     only component in the project that holds funds; it is not allowed to
#     regress silently.
#   - `pytest`: the Python SDK is a scored integration surface. Its 55 tests ran
#     nowhere for weeks — the package's `test` script only checks codegen drift —
#     so a broken adapter would have shipped green.
#   - `fixtures`: the `conditionHash` vectors are a COMMITMENT. If canonicalisation
#     changes, already-open warrants become unevaluable. CI regenerates the
#     fixtures and fails if they move, turning an invisible break into a build
#     failure.
#
# No deployment, no secret: not one step needs a key, and a CI that cannot spend
# money cannot lose any.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `build` FIRST, and this is not a preference.
      #
      # The workspace packages resolve each other through their `exports`, which
      # point at `dist/`. On a fresh clone `dist/` does not exist yet, so
      # `@warrant/core` resolves to nothing and every package that imports it
      # fails typecheck with TS2307 — while the same command passes on any
      # machine that has built once. That is exactly how this job stayed red
      # from 2026-07-30 onwards without anyone reproducing it locally.
      - name: build
        run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # The fixtures are regenerated then compared. A diff here means the JCS
      # canonicalisation or the hash computation has changed — hence that
      # commitments already made no longer recompute identically.
      - name: hash fixtures unchanged
        run: |
          pnpm fixtures
          if ! git diff --quiet -- packages/core/fixtures; then
            echo "::error::the conditionHash vectors have changed — an already-open warrant would become unevaluable"
            git --no-pager diff -- packages/core/fixtures
            exit 1
          fi

      # Same argument, applied to the classification registries: `registryRef` is
      # the keccak of the registry's canonical form, and it is inscribed in the
      # `actionSpec` of every warrant ever opened. A label edited for style —
      # translating a French one, say — changes the fingerprint and detaches
      # every past warrant from the registry that classified it.
      - name: classification registries unchanged
        run: |
          node --import tsx -e '
            import { readFileSync } from "node:fs"
            import { parseRegistry, registryRefOf } from "@warrant/core"
            const pinned = {
              "deployments/registry-base-sepolia.json":
                "0x62bc8078d52fd768cfb96011df5011fdbd5832539586b997631e472ec979b90e",
            }
            let bad = 0
            for (const [file, expected] of Object.entries(pinned)) {
              const got = registryRefOf(parseRegistry(readFileSync(file, "utf8")))
              if (got !== expected) {
                console.error(`::error::${file}: registryRef is ${got}, pinned at ${expected}`)
                bad++
              }
            }
            process.exit(bad ? 1 : 0)
          '

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The adapters are optional extras, and the tests exercise them: installing
      # only the base package would skip the LangChain and CrewAI suites and
      # report green over untested code.
      - name: install
        working-directory: packages/sdk-py
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: pytest
        working-directory: packages/sdk-py
        run: pytest -q

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge fmt --check
        working-directory: contracts

      - run: forge test -vv
        working-directory: contracts

  # A committed secret is unrecoverable: it must be considered disclosed the
  # moment it is pushed. This guard is deliberately dumb and fast.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: no .env and no private key committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"
            exit 1
          fi
          # Anvil's deterministic accounts #0 and #1 are published in every
          # Foundry tutorial and hold nothing on any real network. They appear in
          # the quickstart docs on purpose, so that a reader can run the local
          # example by copy-paste. Matching them was making this job — the one
          # named "no private key committed" — fail on a project whose subject is
          # security, which reads to an outsider as a leak we did not have.
          # Everything else still fails hard.
          PUBLIC_TEST_KEYS='0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80|0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d'
          if git grep -nIE '^[^#]*(PRIVATE_KEY|SECRET)[[:space:]]*=[[:space:]]*(0x[0-9a-fA-F]{64}|[A-Za-z0-9_-]{24,})' \
               -- . ':!*.example' ':!.github/**' \
             | grep -vE "$PUBLIC_TEST_KEYS"; then
            echo "::error::a value that looks like a key is committed"
            exit 1
          fi
