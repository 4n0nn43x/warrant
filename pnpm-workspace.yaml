packages:
  - 'packages/*'
  - 'apps/*'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@modelcontextprotocol/sdk@1.30.0'

# Transitive versions forced to a patched release.
#
# None is reachable in anything this repository ships — the runtime image
# installs production dependencies only — but each carries an open advisory and
# a pinned floor costs nothing:
#
#   vite   dev server `server.fs.deny` bypass on Windows alternate paths.
#          Pulled in by vitest; no vite dev server has existed here since the
#          explorer was removed.
#   axios  Node HTTP adapter can use an inherited proxy. Pulled in by
#          @coinbase/cdp-sdk, a root devDependency.
#   @hono/node-server
#          `serve-static` path traversal through an encoded backslash, on
#          Windows hosts only. The Gateway was never in range — it resolves
#          2.1.0 — and the vulnerable 1.19.17 arrived under @warrant/mcp, which
#          is private, absent from the image, and calls no `serveStatic`. The
#          floor is here rather than a version bump because there is no patched
#          1.x: the fix is 2.0.5, and @modelcontextprotocol/node still asks for
#          ^1.19.9. Forcing the major across that boundary is the reason the MCP
#          suite is the one that has to stay green.
overrides:
  vite: '>=6.4.3'
  axios: '>=1.18.0'
  '@hono/node-server': '>=2.0.5'

