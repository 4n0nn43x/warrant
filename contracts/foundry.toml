[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache_forge"

solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = false

bytecode_hash = "none"
cbor_metadata = false

remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false
call_override = false
shrink_run_limit = 5000

[profile.ci.fuzz]
runs = 1024

[profile.ci.invariant]
runs = 512
depth = 128

[lint]
# `block.timestamp` est le pivot du contrat : `expiry` est une borne dure sur le pouvoir du
# settler (invariant I9). Les fenêtres sont de 15 min à 7 jours, très au-delà de la marge de
# manipulation d'un séquenceur — l'avertissement ne s'applique pas ici.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base = "${BASE_RPC}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
