[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warrant-sdk"
version = "0.1.0"
description = "Bonded execution for onchain agents — LangChain and CrewAI tools, x402 payments, CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Warrant" }]
keywords = ["agents", "langchain", "crewai", "x402", "ethereum", "onchain", "keeperhub"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

# Deux dépendances, et pas une de plus. Le transport HTTP est `urllib` de la
# bibliothèque standard : ce paquet est installé par `uvx` dans le runtime d'un
# agent, où chaque dépendance transitive de plus est un conflit de version en
# puissance avec ce que l'hôte importe déjà.
#
#   pydantic     — les modèles d'arguments générés, et ce que les deux
#                  frameworks attendent comme `args_schema` ;
#   eth-account  — la signature EIP-712 de l'autorisation EIP-3009, plus
#                  keccak256 et l'encodage ABI dont dépend `termsHash`.
dependencies = ["pydantic>=2.7", "eth-account>=0.13"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
dev = ["pytest>=8", "langchain-core>=0.3", "crewai>=0.80"]

[project.urls]
Homepage = "https://warrant.sh"
Documentation = "https://warrant.sh/docs"

[project.scripts]
warrant = "warrant_sdk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]
filterwarnings = ["ignore::DeprecationWarning"]
